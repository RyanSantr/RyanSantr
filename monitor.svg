<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250" xml:space="preserve">
  <style>
    text { font-family: ui-monospace, "Cascadia Code", "Fira Code", Consolas, Menlo, monospace; font-size: 12px; white-space: pre; }
    .t11 { font-size: 11px; }
    .w  { fill: #c9d1d9; }
    .g  { fill: #3fb950; }
    .gn { fill: #39ff14; }
    .y  { fill: #d29922; }
    .r  { fill: #f85149; }
    .c  { fill: #39c5cf; }
    .m  { fill: #bc8cff; }
    .dim{ fill: #8b949e; }
    .bar { fill: #39ff14; transform-box: fill-box; transform-origin: 0% 50%; }
    @keyframes c1 { 0% { transform: scaleX(.25); } 50% { transform: scaleX(.92); } 100% { transform: scaleX(.25); } }
    @keyframes c2 { 0% { transform: scaleX(.70); } 50% { transform: scaleX(.15); } 100% { transform: scaleX(.70); } }
    @keyframes c3 { 0% { transform: scaleX(.40); } 50% { transform: scaleX(.99); } 100% { transform: scaleX(.40); } }
    @keyframes c4 { 0% { transform: scaleX(.85); } 50% { transform: scaleX(.35); } 100% { transform: scaleX(.85); } }
    .fA { animation: fA 2s steps(1) infinite; }
    .fB { opacity: 0; animation: fB 2s steps(1) infinite; }
    @keyframes fA { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes fB { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
  </style>

  <defs>
    <pattern id="scan3" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- janela -->
  <rect x="0" y="0" width="400" height="250" rx="10" fill="#0d1117"/>
  <rect x="0" y="0" width="400" height="28" rx="10" fill="#161b22"/>
  <rect x="0" y="18" width="400" height="10" fill="#161b22"/>
  <line x1="0" y1="28" x2="400" y2="28" stroke="#30363d" stroke-width="1"/>
  <circle cx="18" cy="14" r="5" fill="#ff5f56"/>
  <circle cx="34" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="50" cy="14" r="5" fill="#27c93f"/>
  <text x="200" y="18" text-anchor="middle" class="dim t11">ryan@arch: ~ — vigilância</text>
  <text x="384" y="18" text-anchor="end" class="t11"><tspan class="r" style="animation:blink 1.4s steps(1) infinite">●</tspan><tspan class="dim"> rec</tspan></text>

  <!-- CPUs -->
  <text x="18" y="52" class="c">CPU0 [</text>
  <rect x="72" y="43" width="220" height="9" rx="2" fill="#21262d"/>
  <rect class="bar" x="72" y="43" width="220" height="9" rx="2" style="animation:c1 2.3s ease-in-out infinite"/>
  <text x="298" y="52" class="c">]</text>
  <text x="312" y="52"><tspan class="w fA">87%</tspan></text>
  <text x="312" y="52"><tspan class="w fB">31%</tspan></text>

  <text x="18" y="70" class="c">CPU1 [</text>
  <rect x="72" y="61" width="220" height="9" rx="2" fill="#21262d"/>
  <rect class="bar" x="72" y="61" width="220" height="9" rx="2" style="animation:c2 3.1s ease-in-out infinite"/>
  <text x="298" y="70" class="c">]</text>
  <text x="312" y="70"><tspan class="w fA">44%</tspan></text>
  <text x="312" y="70"><tspan class="w fB">68%</tspan></text>

  <text x="18" y="88" class="c">CPU2 [</text>
  <rect x="72" y="79" width="220" height="9" rx="2" fill="#21262d"/>
  <rect class="bar" x="72" y="79" width="220" height="9" rx="2" style="animation:c3 1.7s ease-in-out infinite"/>
  <text x="298" y="88" class="c">]</text>
  <text x="312" y="88"><tspan class="w fA">99%</tspan></text>
  <text x="312" y="88"><tspan class="w fB">52%</tspan></text>

  <text x="18" y="106" class="c">CPU3 [</text>
  <rect x="72" y="97" width="220" height="9" rx="2" fill="#21262d"/>
  <rect class="bar" x="72" y="97" width="220" height="9" rx="2" style="animation:c4 2.9s ease-in-out infinite"/>
  <text x="298" y="106" class="c">]</text>
  <text x="312" y="106"><tspan class="w fA">61%</tspan></text>
  <text x="312" y="106"><tspan class="w fB">78%</tspan></text>

  <text x="18" y="124" class="m">MEM  [</text>
  <rect x="72" y="115" width="220" height="9" rx="2" fill="#21262d"/>
  <rect x="72" y="115" width="180" height="9" rx="2" fill="#bc8cff"/>
  <text x="298" y="124" class="m">]</text>
  <text x="312" y="124" class="w">6.6G</text>

  <line x1="12" y1="136" x2="388" y2="136" stroke="#21262d" stroke-width="1"/>

  <!-- processos -->
  <text x="18" y="154" class="dim"> PID  USER   CMD</text>
  <text x="18" y="172" class="gn">1337  ryan   ./dragao --fogo</text>
  <text x="18" y="190" class="r">0303  root   vigilancia.d</text>
  <text x="18" y="208" class="w">4242  ryan   sonho.exe &lt;zumbi&gt;</text>
  <text x="18" y="226" class="m">0001  ???    /usr/bin/abismo</text>

  <!-- hexdump -->
  <text x="18" y="243"><tspan class="y fA">0xDEAD</tspan><tspan class="dim fA">  6f 6c 68 65 20 61 74 72 61 73  |olhe atras|</tspan></text>
  <text x="18" y="243"><tspan class="y fB">0xBEEF</tspan><tspan class="dim fB">  65 6c 65 20 74 65 20 76 69 75  |ele te viu|</tspan></text>

  <!-- scanlines -->
  <rect x="2" y="29" width="396" height="219" fill="url(#scan3)"/>
  <rect x=".5" y=".5" width="399" height="249" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
