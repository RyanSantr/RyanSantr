<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" xml:space="preserve">
  <style>
    text { font-family: ui-monospace, "Cascadia Code", "Fira Code", Consolas, Menlo, monospace; font-size: 13px; white-space: pre; }
    .t12 { font-size: 12px; }
    .w  { fill: #c9d1d9; }
    .g  { fill: #3fb950; }
    .gn { fill: #39ff14; }
    .b  { fill: #58a6ff; }
    .y  { fill: #d29922; }
    .r  { fill: #f85149; }
    .c  { fill: #39c5cf; }
    .m  { fill: #bc8cff; }
    .dim{ fill: #8b949e; }
    .ln { opacity: 0; animation: show .01s linear forwards; }
    @keyframes show { to { opacity: 1; } }
    .cov { fill: #0d1117; transform-box: fill-box; transform-origin: 100% 50%; }
    @keyframes type { to { transform: scaleX(0); } }
    .bar { fill: #39ff14; transform: scaleX(0); transform-box: fill-box; transform-origin: 0% 50%; }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    .scroll { animation: scroll 22.5s linear forwards; }
    @keyframes scroll {
      0%, 40%   { transform: translateY(0); }
      49.3%     { transform: translateY(-72px); }
      58.7%     { transform: translateY(-144px); }
      68%       { transform: translateY(-162px); }
      71.1%     { transform: translateY(-198px); }
      79.6%     { transform: translateY(-216px); }
      82.2%     { transform: translateY(-252px); }
      85.3%     { transform: translateY(-288px); }
      90.2%     { transform: translateY(-306px); }
      94.7%     { transform: translateY(-486px); }
      96.9%, 100% { transform: translateY(-522px); }
    }
  </style>

  <defs>
    <clipPath id="body"><rect x="2" y="36" width="856" height="496"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- janela -->
  <rect x="0" y="0" width="860" height="540" rx="12" fill="#0d1117"/>
  <rect x="0" y="0" width="860" height="36" rx="12" fill="#161b22"/>
  <rect x="0" y="24" width="860" height="12" fill="#161b22"/>
  <line x1="0" y1="36" x2="860" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#27c93f"/>
  <text x="430" y="22" text-anchor="middle" class="dim t12">ryan@arch: ~ — bash</text>
  <text x="836" y="22" text-anchor="end" class="t12"><tspan class="r">●</tspan><tspan class="dim"> rec</tspan></text>

  <g clip-path="url(#body)">
    <g class="scroll">

      <!-- ===== BOOT ===== -->
      <text x="24" y="62" class="dim ln" style="animation-delay:.3s">Arch Linux 6.6.6-abismo (tty1)</text>
      <text x="24" y="98" class="ln" style="animation-delay:.7s"><tspan class="g">[  OK  ]</tspan><tspan class="w"> Iniciando ryan.service</tspan></text>
      <text x="24" y="116" class="ln" style="animation-delay:1s"><tspan class="g">[  OK  ]</tspan><tspan class="w"> Montando /dev/realidade (somente leitura)</tspan></text>
      <text x="24" y="134" class="ln" style="animation-delay:1.3s"><tspan class="r">[FALHOU]</tspan><tspan class="w"> privacidade.service: unidade não encontrada</tspan></text>
      <text x="24" y="152" class="ln" style="animation-delay:1.6s"><tspan class="g">[  OK  ]</tspan><tspan class="w"> Invocando dragao.service (não alimentar após 00h)</tspan></text>
      <text x="24" y="188" class="w ln" style="animation-delay:2.1s">arch login: ryan</text>
      <text x="24" y="206" class="ln" style="animation-delay:2.5s"><tspan class="w">Senha: </tspan><tspan class="dim">********</tspan></text>
      <text x="24" y="224" class="dim ln" style="animation-delay:2.8s">Último login: hoje às 03:47 (ainda acordado)</text>

      <!-- ===== whoami ===== -->
      <g class="ln" style="animation-delay:3.2s">
        <text x="24" y="260" class="g" textLength="94" lengthAdjust="spacingAndGlyphs">ryan@arch:~$</text>
        <text x="126" y="260" class="w">whoami</text>
        <rect class="cov" x="124" y="246" width="200" height="18" style="animation:type .6s steps(8) 3.4s forwards"/>
      </g>
      <text x="24" y="278" class="ln" style="animation-delay:4.4s"><tspan class="w">ryan-santos — o tal do usuário linux, agora com dragão </tspan><tspan>🐉</tspan></text>

      <!-- ===== neofetch ===== -->
      <g class="ln" style="animation-delay:5s">
        <text x="24" y="314" class="g" textLength="94" lengthAdjust="spacingAndGlyphs">ryan@arch:~$</text>
        <text x="126" y="314" class="w">neofetch</text>
        <rect class="cov" x="124" y="300" width="200" height="18" style="animation:type .7s steps(9) 5.2s forwards"/>
      </g>
      <text x="32" y="332" class="gn ln" style="animation-delay:6s">                  __</text>
      <text x="32" y="350" class="gn ln" style="animation-delay:6.1s">                / o_)</text>
      <text x="32" y="368" class="gn ln" style="animation-delay:6.2s">          /\   / /</text>
      <text x="32" y="386" class="gn ln" style="animation-delay:6.3s">         /  \_/ /</text>
      <text x="32" y="404" class="gn ln" style="animation-delay:6.4s">     ___/      /</text>
      <text x="32" y="422" class="gn ln" style="animation-delay:6.5s">    /   |    |</text>
      <text x="32" y="440" class="gn ln" style="animation-delay:6.6s"> __/    |    |</text>
      <text x="32" y="458" class="gn ln" style="animation-delay:6.7s">&lt;__..--'|_|--|_|</text>
      <text x="216" y="332" class="ln" style="animation-delay:6s"><tspan class="c">ryan</tspan><tspan class="w">@</tspan><tspan class="c">arch</tspan></text>
      <text x="216" y="350" class="dim ln" style="animation-delay:6.1s">──────────────────────</text>
      <text x="216" y="368" class="ln" style="animation-delay:6.2s"><tspan class="c">OS........: </tspan><tspan class="w">Arch Linux </tspan><tspan class="dim">(btw)</tspan></text>
      <text x="216" y="386" class="ln" style="animation-delay:6.3s"><tspan class="c">Curso.....: </tspan><tspan class="w">Ciência da Computação — Unespar</tspan></text>
      <text x="216" y="404" class="ln" style="animation-delay:6.4s"><tspan class="c">Kernel....: </tspan><tspan class="w">6.6.6-abismo</tspan></text>
      <text x="216" y="422" class="ln" style="animation-delay:6.5s"><tspan class="c">Uptime....: </tspan><tspan class="w">desde 2005 (sem reiniciar)</tspan></text>
      <text x="216" y="440" class="ln" style="animation-delay:6.6s"><tspan class="c">Shell.....: </tspan><tspan class="w">bash — o eco responde de volta</tspan></text>
      <text x="216" y="458" class="ln" style="animation-delay:6.7s"><tspan class="c">Memória...: </tspan><tspan class="w">2% RAM · 98% não identificado</tspan></text>
      <g class="ln" style="animation-delay:6.9s">
        <rect x="216" y="466" width="16" height="12" fill="#0d1117" stroke="#30363d"/>
        <rect x="234" y="466" width="16" height="12" fill="#f85149"/>
        <rect x="252" y="466" width="16" height="12" fill="#3fb950"/>
        <rect x="270" y="466" width="16" height="12" fill="#d29922"/>
        <rect x="288" y="466" width="16" height="12" fill="#58a6ff"/>
        <rect x="306" y="466" width="16" height="12" fill="#bc8cff"/>
        <rect x="324" y="466" width="16" height="12" fill="#39c5cf"/>
        <rect x="342" y="466" width="16" height="12" fill="#c9d1d9"/>
      </g>

      <!-- ===== pacman ===== -->
      <g class="ln" style="animation-delay:7.8s">
        <text x="24" y="512" class="g" textLength="94" lengthAdjust="spacingAndGlyphs">ryan@arch:~$</text>
        <text x="126" y="512" class="w">sudo pacman -S habilidades</text>
        <rect class="cov" x="124" y="498" width="300" height="18" style="animation:type 1.3s steps(26) 8s forwards"/>
      </g>
      <text x="24" y="530" class="ln" style="animation-delay:9.6s"><tspan class="y">[sudo]</tspan><tspan class="w"> senha para ryan: </tspan><tspan class="dim">********</tspan></text>
      <text x="24" y="548" class="ln" style="animation-delay:10.2s"><tspan class="w">resolvendo dependências... </tspan><tspan class="y">aviso:</tspan><tspan class="w"> "dormir" conflita com "programar"</tspan></text>
      <text x="24" y="566" class="ln" style="animation-delay:10.7s"><tspan class="w">Pacotes (4)  </tspan><tspan class="c">java-21  python-3.12  c-99  nodejs-22</tspan></text>
      <text x="24" y="584" class="ln" style="animation-delay:11.2s"><tspan class="b">:: </tspan><tspan class="w">Prosseguir com a instalação? [S/n] </tspan><tspan class="g">S</tspan></text>

      <g class="ln" style="animation-delay:12s">
        <text x="24" y="602" class="w">(1/4) java-21</text>
        <rect x="250" y="592" width="220" height="9" rx="4" fill="#21262d"/>
        <rect class="bar" x="250" y="592" width="220" height="9" rx="4" style="animation:grow 1s steps(20) 12s forwards"/>
        <text x="482" y="602" class="g ln" style="animation-delay:13.1s">100%</text>
      </g>
      <g class="ln" style="animation-delay:12.4s">
        <text x="24" y="620" class="w">(2/4) python-3.12</text>
        <rect x="250" y="610" width="220" height="9" rx="4" fill="#21262d"/>
        <rect class="bar" x="250" y="610" width="220" height="9" rx="4" style="animation:grow 1.2s steps(20) 12.4s forwards"/>
        <text x="482" y="620" class="g ln" style="animation-delay:13.7s">100%</text>
      </g>
      <g class="ln" style="animation-delay:12.8s">
        <text x="24" y="638" class="w">(3/4) c-99</text>
        <rect x="250" y="628" width="220" height="9" rx="4" fill="#21262d"/>
        <rect class="bar" x="250" y="628" width="220" height="9" rx="4" style="animation:grow 1.4s steps(20) 12.8s forwards"/>
        <text x="482" y="638" class="g ln" style="animation-delay:14.3s">100%</text>
      </g>
      <g class="ln" style="animation-delay:13.2s">
        <text x="24" y="656" class="w">(4/4) nodejs-22</text>
        <rect x="250" y="646" width="220" height="9" rx="4" fill="#21262d"/>
        <rect class="bar" x="250" y="646" width="220" height="9" rx="4" style="animation:grow 1.6s steps(20) 13.2s forwards"/>
        <text x="482" y="656" class="g ln" style="animation-delay:14.9s">100%</text>
      </g>
      <text x="24" y="674" class="ln" style="animation-delay:15.3s"><tspan class="g">✔ </tspan><tspan class="w">habilidades instaladas — recompilando o cérebro... </tspan><tspan class="g">ok</tspan></text>

      <!-- ===== strings /dev/mente ===== -->
      <g class="ln" style="animation-delay:16s">
        <text x="24" y="710" class="g" textLength="94" lengthAdjust="spacingAndGlyphs">ryan@arch:~$</text>
        <text x="126" y="710" class="w">strings /dev/mente | head -3</text>
        <rect class="cov" x="124" y="696" width="260" height="18" style="animation:type 1.4s steps(28) 16.2s forwards"/>
      </g>
      <text x="24" y="728" class="w ln" style="animation-delay:17.9s">eles estão ouvindo</text>
      <text x="24" y="746" class="y ln" style="animation-delay:18.2s">a privacidade é um mito</text>
      <text x="24" y="764" class="r ln" style="animation-delay:18.5s">você já está dentro</text>

      <!-- ===== mente.asm ===== -->
      <g class="ln" style="animation-delay:19.2s">
        <text x="24" y="800" class="g" textLength="94" lengthAdjust="spacingAndGlyphs">ryan@arch:~$</text>
        <text x="126" y="800" class="w">cat mente.asm</text>
        <rect class="cov" x="124" y="786" width="160" height="18" style="animation:type .7s steps(13) 19.4s forwards"/>
      </g>
      <text x="24" y="818" class="b ln" style="animation-delay:20.3s">section .data</text>
      <text x="24" y="836" class="ln" style="animation-delay:20.4s"><tspan class="w">    mente db </tspan><tspan class="y">"onde está seu deus?"</tspan><tspan class="w">, 0x8</tspan><tspan class="dim">   ; eles vão nos encontrar</tspan></text>
      <text x="24" y="854" class="w ln" style="animation-delay:20.5s">    mente_len equ $ - mente</text>
      <text x="24" y="872" class="b ln" style="animation-delay:20.6s">section .text</text>
      <text x="24" y="890" class="ln" style="animation-delay:20.7s"><tspan class="w">    global </tspan><tspan class="m">_start</tspan></text>
      <text x="24" y="908" class="ln" style="animation-delay:20.8s"><tspan class="m">_start:</tspan><tspan class="dim">                                ; o rastreio não precisa de internet</tspan></text>
      <text x="24" y="926" class="ln" style="animation-delay:20.9s"><tspan class="c">    mov</tspan><tspan class="w"> rax, 1</tspan></text>
      <text x="24" y="944" class="ln" style="animation-delay:21s"><tspan class="c">    mov</tspan><tspan class="w"> rdi, 1</tspan></text>
      <text x="24" y="962" class="ln" style="animation-delay:21.1s"><tspan class="c">    mov</tspan><tspan class="w"> rsi, mente</tspan></text>
      <text x="24" y="980" class="ln" style="animation-delay:21.2s"><tspan class="c">    mov</tspan><tspan class="w"> rdx, mente_len</tspan><tspan class="dim">                 ; run</tspan></text>
      <text x="24" y="998" class="ln" style="animation-delay:21.3s"><tspan class="c">    syscall</tspan><tspan class="dim">                             ; ninguém está no controle</tspan></text>

      <!-- ===== prompt final ===== -->
      <g class="ln" style="animation-delay:21.8s">
        <text x="24" y="1034" class="g" textLength="94" lengthAdjust="spacingAndGlyphs">ryan@arch:~$</text>
      </g>
      <rect x="126" y="1021" width="8" height="15" fill="#39ff14" opacity="0" style="animation:blink 1.1s steps(1) 22s infinite"/>

    </g>
  </g>

  <!-- scanlines CRT -->
  <rect x="2" y="37" width="856" height="495" fill="url(#scan)"/>

  <!-- borda -->
  <rect x=".5" y=".5" width="859" height="539" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
