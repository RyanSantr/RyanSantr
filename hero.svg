<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" xml:space="preserve">
  <style>
    text { font-family: ui-monospace, "Cascadia Code", "Fira Code", Consolas, Menlo, monospace; font-size: 12px; white-space: pre; }
    .code { fill: #3fb950; }
    .str  { fill: #7ee787; }
    .com  { fill: #2f8f4e; font-style: italic; }
    .lbl  { fill: #56d364; }
    .gn   { fill: #39ff14; font-size: 17px; }
    .hexbg{ fill: #3fb950; opacity: .06; }
    .blk  { opacity: 0; animation: show .01s linear forwards; }
    @keyframes show { to { opacity: 1; } }
    .bob { animation: bob 2.8s ease-in-out infinite alternate; }
    @keyframes bob { to { transform: translateY(5px); } }
    .eyeO { animation: eyeO 4s steps(1) infinite; }
    .eyeC { opacity: 0; animation: eyeC 4s steps(1) infinite; }
    @keyframes eyeO { 0%, 91% { opacity: 1; } 92%, 100% { opacity: 0; } }
    @keyframes eyeC { 0%, 91% { opacity: 0; } 92%, 100% { opacity: 1; } }
    .fA { animation: fA .5s steps(1) infinite; }
    .fB { opacity: 0; animation: fB .5s steps(1) infinite; }
    @keyframes fA { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes fB { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
    .gA { animation: gA 3.4s steps(1) infinite; }
    .gB { opacity: 0; animation: gB 3.4s steps(1) infinite; }
    @keyframes gA { 0%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }
    @keyframes gB { 0%, 88% { opacity: 0; } 89%, 100% { opacity: 1; } }
    .smk { animation: smk 2.4s linear infinite; }
    .smk2 { animation: smk 2.4s linear 1.2s infinite; opacity: 0; }
    @keyframes smk { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: .6; } 100% { transform: translateY(-14px); opacity: 0; } }
    .hexpulse { animation: pulse 8s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: .6; } to { opacity: 1; } }
    .mk-note { fill: #39c5bb; font-size: 15px; }
    .mk-tag { fill: #2fa39a; font-size: 11px; letter-spacing: 2px; }
    .smk3 { animation: smk 2.4s linear 1.7s infinite; opacity: 0; }
    .tailL { animation: swayL 2.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 0%; }
    .tailR { animation: swayL 2.6s ease-in-out -1.3s infinite alternate; transform-box: fill-box; transform-origin: 50% 0%; }
    @keyframes swayL { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
  </style>

  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39c5bb" stop-opacity=".11"/>
      <stop offset="100%" stop-color="#39c5bb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect x="0" y="0" width="920" height="480" rx="8" fill="#1b1e19"/>

  <!-- hexdump fantasma -->
  <g class="hexpulse">
    <text x="8"  y="28"  class="hexbg">7f 45 4c 46 02 01 01 00 00 00 00 00 00 00 00 00 02 00 3e 00 01 00 00 00 78 00 40 00 00 00 00 00 40 00 00 00 00 00 00 00 c8 10</text>
    <text x="8"  y="168" class="hexbg">6f 6c 68 65 20 61 74 72 61 73 00 00 65 6c 65 20 74 65 20 76 69 75 00 00 61 63 6f 72 64 65 00 00 76 6f 63 65 20 6a 61 20 65 73</text>
    <text x="8"  y="288" class="hexbg">01 00 00 00 05 00 00 00 00 00 00 00 00 00 00 00 00 00 40 00 00 00 00 00 00 10 00 00 00 00 00 00 00 10 00 00 00 00 00 00 00 00</text>
    <text x="8"  y="408" class="hexbg">74 61 20 64 65 6e 74 72 6f 00 00 00 6e 69 6e 67 75 65 6d 20 6e 6f 20 63 6f 6e 74 72 6f 6c 65 00 00 00 00 00 00 00 00 00 00 00</text>
    <text x="8"  y="472" class="hexbg">00 2e 74 65 78 74 00 2e 64 61 74 61 00 2e 62 73 73 00 2e 6d 65 6e 74 65 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00</text>
  </g>

  <!-- halo atrás do dragão -->
  <ellipse cx="482" cy="255" rx="190" ry="150" fill="url(#halo)"/>

  <!-- ===== coluna esquerda ===== -->
  <g class="blk" style="animation-delay:.2s">
    <text x="36" y="46"  class="code">section .data</text>
    <text x="36" y="63"  class="code">    mente db <tspan class="str">"onde está seu deus?"</tspan>, 0x8</text>
    <text x="36" y="80"  class="code">    mente_len equ $ - mente</text>
    <text x="36" y="97"  class="code">section .text</text>
    <text x="36" y="114" class="code">    global _start    <tspan class="com">; eles vão nos encontrar</tspan></text>
    <text x="36" y="131" class="code">section .bss</text>
    <text x="36" y="148" class="code">    pensamento resb 10</text>
  </g>

  <g class="blk" style="animation-delay:.9s">
    <text x="36" y="192" class="lbl">_start:</text>
    <text x="36" y="209" class="code">    mov rax, 1</text>
    <text x="36" y="226" class="code">    mov rdi, 1</text>
    <text x="36" y="243" class="code">    mov rsi, mente</text>
    <text x="36" y="260" class="code">    mov rdx, mente_len       <tspan class="com">; run</tspan></text>
    <text x="36" y="277" class="code">    syscall</text>
    <text x="36" y="311" class="code">    mov rax, 60</text>
    <text x="36" y="328" class="code">    mov rdi, 0</text>
    <text x="36" y="345" class="code">    syscall          <tspan class="com">; ninguém no controle</tspan></text>
  </g>

  <g class="blk" style="animation-delay:1.3s">
    <text x="36" y="388" class="code">section .data</text>
    <text x="36" y="405" class="code">    mente db <tspan class="str">"todos estão conectados"</tspan>, 0x8</text>
    <text x="36" y="422" class="code">    mente_len equ $ - mente</text>
    <text x="36" y="439" class="code">section .text</text>
    <text x="36" y="456" class="code">    global _start</text>
  </g>

  <!-- ===== coluna direita ===== -->
  <g class="blk" style="animation-delay:.4s">
    <text x="616" y="46"  class="code">section .data</text>
    <text x="616" y="63"  class="code">    mente db <tspan class="str">"eles estão observando"</tspan>, 0x8</text>
    <text x="616" y="80"  class="code">    mente_len equ $ - mente</text>
    <text x="616" y="97"  class="code">section .text</text>
    <text x="616" y="114" class="code">    global _start</text>
    <text x="616" y="131" class="code">section .bss</text>
    <text x="616" y="148" class="code">    pensamento resb 10</text>
  </g>

  <g class="blk" style="animation-delay:1.1s">
    <text x="616" y="218" class="lbl">_start:    <tspan class="com">; o rastreio dispensa internet</tspan></text>
    <text x="616" y="235" class="code">    mov rax, 1</text>
    <text x="616" y="252" class="code">    mov rdi, 1</text>
    <text x="616" y="269" class="code">    mov rsi, mente</text>
    <text x="616" y="286" class="code">    mov rdx, mente_len</text>
    <text x="616" y="303" class="code">    syscall</text>
  </g>

  <g class="blk" style="animation-delay:1.5s">
    <text x="616" y="388" class="code">section .data</text>
    <text x="616" y="405" class="code gA">    mente db <tspan class="str">"o metal não é seguro"</tspan>, 0x8</text>
    <text x="616" y="405" class="code gB">    mente db <tspan class="str">"o ▓▓▓▓▓ não é ▓▓▓▓▓▓"</tspan>, 0x8</text>
    <text x="616" y="422" class="code">section .text</text>
    <text x="616" y="439" class="code">    global _start   <tspan class="com">; privacidade é mito</tspan></text>
  </g>

